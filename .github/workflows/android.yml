name: Android Debug Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 Cython==0.29.37

      # Do not reuse a partially installed SDK while diagnosing the first build.
      - name: Reset Android build state
        run: rm -rf .buildozer "$HOME/.buildozer"

      # `p4a` runs Buildozer's install_platform() first: it installs the SDK,
      # NDK, platform-tools, build-tools (including aidl), and android-33.
      - name: Initialize Android SDK and python-for-android
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: buildozer -v android p4a -- --help

      - name: Build ARM64 debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: buildozer -v android debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BrickManager-android-debug
          path: bin/*.apk
          if-no-files-found: error
